<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitalis Client</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/index/titlebar.css" />
    <link rel="stylesheet" href="css/index/sidebar.css" />
    <link rel="stylesheet" href="css/index/chapters.css" />
    <link rel="stylesheet" href="css/index/index.css" />

    <link rel="stylesheet" href="css/custom-styles/elevated.css" />

    <link rel="stylesheet" href="css/chapters/servers/servers.css" />
    <link rel="stylesheet" href="css/chapters/servers/add-server.css" />
  </head>
  <body no-transitions>
    <div class="main">
      <div class="titlebar-container">
        <div class="titlebar-drag-area"></div>

        <div class="titlebar-actions">
          <button class="titlebar-action" id="minimize">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus-icon lucide-minus"><path d="M5 12h14" /></svg>
          </button>

          <button class="titlebar-action" id="maximize">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-icon lucide-square"><rect width="18" height="18" x="3" y="3" rx="2" /></svg>
          </button>

          <button class="titlebar-action" id="close">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-container">
        <div class="sidebar-title">
          <img src="./../src/assets/icons/app/vitalis-client-256.png" alt="" />
          <span>Vitalis Client</span>

          <button class="sidebar-collapse-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left-to-line-icon lucide-arrow-left-to-line">
              <path d="M3 19V5" />
              <path d="m13 6-6 6 6 6" />
              <path d="M7 12h14" />
            </svg>
          </button>
        </div>

        <div class="sidebar-buttons-container">
          <button class="chapter-button" data-chapter-name="dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard-icon lucide-layout-dashboard">
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            <span>Dashboard</span>
          </button>

          <button class="chapter-button active" data-chapter-name="servers">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-server-icon lucide-server">
              <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
              <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
              <line x1="6" x2="6.01" y1="6" y2="6" />
              <line x1="6" x2="6.01" y1="18" y2="18" />
            </svg>
            <span>Servers</span>
          </button>

          <button class="chapter-button" data-chapter-name="settings">
            <svg class="dark-theme" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Settings</span>
          </button>

          <button class="action-button" data-action-name="theme">
            <svg class="light-theme-icon hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>

            <svg class="dark-theme-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>

            <span>Theme</span>
          </button>
        </div>
      </div>

      <div class="chapters-container">
        <div class="chapter-container hidden" data-chapter-name="dashboard">
          <div class="chapter-sub-container">
            <div class="chapter-title">
              <div class="chapter-name">Dashboard</div>
              <div class="chapter-actions"></div>
            </div>
          </div>
        </div>

        <div class="chapter-container" data-chapter-name="servers">
          <div class="chapter-sub-container">
            <div class="chapter-title">
              <div class="chapter-name">Servers</div>
              <div class="chapter-actions">
                <button class="chapter-action">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down-icon lucide-file-down">
                    <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                    <path d="M12 18v-6" />
                    <path d="m9 15 3 3 3-3" />
                  </svg>
                  Load servers
                </button>

                <button class="chapter-action">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-up-icon lucide-file-up">
                    <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                    <path d="M12 12v6" />
                    <path d="m15 15-3-3-3 3" />
                  </svg>
                  Export servers
                </button>

                <button class="chapter-action add-server-button colored">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus">
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                  </svg>
                  Add server
                </button>
              </div>
            </div>

            <div class="custom-window add-server-custom-window" hidden title="Add server" width="500px" position="center center" icon='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-server-plus-icon lucide-server-plus"><path d="M12.5 10H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2"/><path d="M16 12h6"/><path d="M19 9v6"/><path d="M22 18v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h8.5"/><path d="M6 18h.01"/><path d="M6 6h.01"/></svg>'>
              <div class="add-server-container">
                <div class="add-server-fields">
                  <label data-style="elevated" for="address" title="The address of the server where Vitalis is running">Address</label>
                  <input data-style="elevated" id="address" type="text" placeholder="127.0.0.1" />

                  <label data-style="elevated" for="port" title="The port of the server running Vitalis">Port</label>
                  <input data-style="elevated" id="port" type="text" placeholder="8080" />

                  <label data-style="elevated" for="secret-key" title="The server's secret key (from the Vitalis .env file)">Secret key</label>
                  <input data-style="elevated" id="secret-key" type="text" placeholder="f28bcf4abf63249***" />

                  <label data-style="elevated" for="schema" title="It is strongly recommended to use https:// (if the server supports it).">Schema</label>
                  <select data-style="elevated" id="schema">
                    <option value="http://">http://</option>
                    <option value="https://">https://</option>
                  </select>
                </div>

                <div class="add-server-actions">
                  <button data-style="elevated" id="add-server-apply">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus">
                      <path d="M5 12h14" />
                      <path d="M12 5v14" />
                    </svg>
                    Add server
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chapter-container hidden" data-chapter-name="settings">
          <div class="chapter-sub-container">
            <div class="chapter-sub-container">
              <div class="chapter-title">
                <div class="chapter-name">Settings</div>
                <div class="chapter-actions"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/lib.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/lib/custom-window.js"></script>
    <script src="js/titlebar/titlebar.js"></script>
    <script src="js/sidebar/sidebar-collapse.js"></script>
    <script src="js/sidebar/sidebar-chapters.js"></script>
    <script src="js/sidebar/sidebar-actions.js"></script>
    <script src="js/chapters/servers/add-server.js"></script>
    <script src="js/chapters/servers/servers.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
